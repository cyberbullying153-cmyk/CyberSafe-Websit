<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | CyberSafe</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:#eef4ff;
}

.container{
max-width:500px;
margin:70px auto;
background:#fff;
padding:40px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#1e3a8a;
margin-bottom:30px;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:600;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#1d4ed8;
}

.links{
text-align:center;
margin-top:25px;
}

.links a{
display:block;
margin-top:10px;
text-decoration:none;
color:#2563eb;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>🎓 Student Login</h1>

<form id="loginForm">

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
required>

</div>

<button type="submit">

Login

</button>

</form>

<div class="links">

<a href="student-register.html">

New Student? Register

</a>
<a href="#" id="forgotPassword">
Forgot Password?
</a>
<a href="login.html">

← Back to Login Portal

</a>

</div>

</div>

<script type="module">

import { auth } from "./js/firebase.js";

import {
signInWithEmailAndPassword,
signOut,
sendEmailVerification
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e)=>{

e.preventDefault();

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{

const userCredential = await signInWithEmailAndPassword(
auth,
email,
password
);

const user = userCredential.user;

if(!user.emailVerified){

await sendEmailVerification(user);

alert("❌ Your email is not verified.\n\nA new verification email has been sent.\nPlease verify your email and then login again.");

await signOut(auth);

return;

}

alert("✅ Login Successful!");

window.location.href="student-dashboard.html";

}

catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
