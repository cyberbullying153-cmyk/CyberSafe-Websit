<section class="login-container">

<h1>👨‍🏫 Staff Login</h1>

<p>
Only registered teachers and administrators can log in.
Students can submit reports without logging in.
</p>

<form id="loginForm" class="login-form">

<input
type="email"
id="email"
placeholder="Teacher Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit" class="btn report-btn">
Login
</button>

</form>

</section>
