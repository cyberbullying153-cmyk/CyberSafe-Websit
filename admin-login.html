<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSafe | Admin Login</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<section class="teacher-login-hero">

<div class="teacher-glow glow1"></div>
<div class="teacher-glow glow2"></div>

<div class="teacher-login-card">

<div class="teacher-logo">
<img src="images/logo.png" alt="CyberSafe">
</div>

<span class="teacher-badge">ADMIN ACCESS</span>

<h1>Administrator Login</h1>

<p>Only authorized administrators can access this portal.</p>

<form id="adminLoginForm">

<div class="input-group">
  <label>Email</label>
  <input type="email" id="email" placeholder="admin@school.com">
</div>

<div class="input-group">
  <label>Password</label>
  <input type="password" id="password" placeholder="Enter password">
</div>

<button id="loginBtn" type="button" class="teacher-login-btn">
  👑 Secure Admin Login
</button>

<p id="loginMessage" class="login-message"></p>

</form>

<p id="adminMessage" class="login-message"></p>

</div>

</section>

<script type="module">
import { auth } from "./js/firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const loginBtn = document.getElementById("loginBtn");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const msg = document.getElementById("loginMessage");

loginBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    msg.textContent = "Please enter email and password.";
    msg.style.color = "#ffb4b4";
    return;
  }

  msg.textContent = "Signing in...";
  msg.style.color = "#ffffff";

  try {
    await signInWithEmailAndPassword(auth, email, password);

    msg.textContent = "Login successful!";
    msg.style.color = "#22c55e";

    setTimeout(() => {
      window.location.href = "admin.html";
    }, 700);

  } catch (error) {
    console.error(error);

    switch (error.code) {
      case "auth/user-not-found":
        msg.textContent = "Admin account not found.";
        break;
      case "auth/wrong-password":
      case "auth/invalid-credential":
        msg.textContent = "Wrong email or password.";
        break;
      case "auth/invalid-email":
        msg.textContent = "Invalid email address.";
        break;
      default:
        msg.textContent = error.code;
    }

    msg.style.color = "#ffb4b4";
  }
});
</script>

</body>
</html>
