<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSafe | Admin Login</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<section class="teacher-login-hero">

<div class="teacher-glow glow1"></div>
<div class="teacher-glow glow2"></div>

<div class="teacher-login-card">

<div class="teacher-logo">
<img src="images/logo.png" alt="CyberSafe">
</div>

<span class="teacher-badge">ADMIN ACCESS</span>

<h1>Administrator Login</h1>

<p>Only authorized administrators can access this portal.</p>

<form id="adminLoginForm">

<div class="input-group">
<label>Email</label>
<input type="email" id="adminEmail" placeholder="admin@school.com" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="adminPassword" placeholder="Enter password" required>
</div>

<button type="submit" class="teacher-login-btn">
👑 Secure Admin Login
</button>

</form>

<p id="adminMessage" class="login-message"></p>

</div>

</section>

<script type="module">
import { auth, db } from "./js/firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("loginForm");
const msg = document.getElementById("loginMessage");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    msg.textContent = "Signing in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        await signInWithEmailAndPassword(auth, email, password);

        const q = query(
            collection(db, "admins"),
            where("email", "==", email)
        );

        const snap = await getDocs(q);

        if (snap.empty) {
            msg.textContent = "Admin account not found.";
            await auth.signOut();
            return;
        }

        const role = snap.docs[0].data().role;

        if (role === "admin") {
            window.location.href = "admin.html";
        } else {
            msg.textContent = "Access denied.";
        }

    } catch (err) {
        console.error(err);
        msg.textContent = "Wrong email or password.";
    }
});
</script>

</body>
</html>
