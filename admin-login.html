```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | CyberSafe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b)}
.card{background:#1e293b;padding:35px;border-radius:20px;width:380px;color:white}
input{width:100%;padding:14px;margin:12px 0;border:none;border-radius:10px;background:#334155;color:white}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#4f46e5;color:white;font-weight:700;cursor:pointer}
#msg{text-align:center;margin-top:15px}
</style>
</head>
<body>

<div class="card">
<h2 style="text-align:center;margin-bottom:20px;">👑 Admin Login</h2>

<input type="email" id="email" placeholder="Admin Email">
<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>

<p id="msg"></p>
</div>

<script type="module">
import { auth } from "./js/firebase.js";
import {
signInWithEmailAndPassword,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Always require login
await signOut(auth);

const btn=document.getElementById("loginBtn");
const msg=document.getElementById("msg");

btn.addEventListener("click",async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

try{

await signInWithEmailAndPassword(auth,email,password);

window.location.href="admin.html";

}catch(e){

msg.textContent="Wrong email or password.";

}

});
</script>

</body>
</html>
```
