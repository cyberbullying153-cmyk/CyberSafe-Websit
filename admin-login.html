<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSafe | Admin Login</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<section class="teacher-login-hero">

<div class="teacher-glow glow1"></div>
<div class="teacher-glow glow2"></div>

<div class="teacher-login-card">

<div class="teacher-logo">
<img src="images/logo.png" alt="CyberSafe">
</div>

<span class="teacher-badge">ADMIN ACCESS</span>

<h1>Administrator Login</h1>

<p>Only authorized administrators can access this portal.</p>

<form id="adminLoginForm">

<div class="input-group">
  <label>Email</label>
  <input type="email" id="email" placeholder="admin@school.com">
</div>

<div class="input-group">
  <label>Password</label>
  <input type="password" id="password" placeholder="Enter password">
</div>

<button id="loginBtn" type="button" class="teacher-login-btn">
  👑 Secure Admin Login
</button>

<p id="loginMessage" class="login-message"></p>

</form>

<p id="adminMessage" class="login-message"></p>

</div>

</section>

<script type="module">
import { auth } from "./js/firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const loginBtn = document.getElementById("loginBtn");
const msg = document.getElementById("loginMessage");

loginBtn.addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  msg.textContent = "Signing in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);

    msg.textContent = "Login successful!";
    window.location.replace("admin.html");

  } catch (error) {
    console.error(error);
    msg.textContent = error.code;
  }

});
</script>

</body>
</html>
