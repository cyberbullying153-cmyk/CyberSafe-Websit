<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Reports | CyberSafe</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:#eef4ff;
}

header{
background:#111827;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

.logo{
display:flex;
align-items:center;
gap:12px;
font-size:28px;
font-weight:700;
}

.logo img{
width:48px;
}

.logout-btn{
background:#ef4444;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
}

.container{
max-width:1200px;
margin:40px auto;
padding:20px;
}

h1{
color:#1e3a8a;
margin-bottom:25px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

th{
background:#1e3a8a;
color:white;
padding:15px;
}

td{
padding:15px;
text-align:center;
border-bottom:1px solid #eee;
}

.status{
padding:6px 12px;
border-radius:20px;
color:white;
font-size:14px;
font-weight:600;
}

.pending{
background:#f59e0b;
}

.review{
background:#3b82f6;
}

.resolved{
background:#22c55e;
}

footer{
margin-top:40px;
padding:20px;
background:#111827;
color:white;
text-align:center;
}

</style>

</head>

<body>

<header>

<div class="logo">
<img src="images/logo.png">
<span>CYBERSAFE</span>
</div>

<button id="logoutBtn" class="logout-btn">
Logout
</button>

</header>

<div class="container">

<h1>📄 My Reports</h1>

<table>

<thead>

<tr>

<th>Date</th>

<th>Platform</th>

<th>Status</th>

<th>Assigned Teacher</th>

<th>Description</th>

</tr>

</thead>

<tbody id="reportBody">

</tbody>

</table>

</div>

<footer>

© 2026 CyberSafe

</footer>
<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const tbody = document.getElementById("reportBody");


/* ================================
   CHECK STUDENT LOGIN
================================ */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "student-login.html";

        return;

    }


    try {

        /* ================================
           GET ONLY THIS STUDENT'S REPORTS
        ================================= */

        const q = query(
            collection(db, "reports"),
            where("studentUID", "==", user.uid),
            orderBy("createdAt", "desc")
        );


        const snapshot = await getDocs(q);


        tbody.innerHTML = "";


        /* ================================
           NO REPORTS
        ================================= */

        if (snapshot.empty) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6" style="
                        text-align:center;
                        padding:30px;
                        color:#64748b;
                    ">
                        📭 You have not submitted any reports yet.
                    </td>
                </tr>
            `;

            return;

        }


        /* ================================
           DISPLAY REPORTS
        ================================= */

        snapshot.forEach((reportDoc) => {

            const data = reportDoc.data();


            /* REPORT ID */

            const reportId =
                data.reportId ||
                reportDoc.id;


            /* STATUS */

            let statusClass = "pending";

            let statusText =
                data.status || "Pending";


            if (statusText === "Resolved") {

                statusClass = "resolved";

            }
            else if (statusText === "Under Review") {

                statusClass = "review";

            }


            /* DATE */

            let reportDate = "N/A";


            if (data.createdAt) {

                if (
                    typeof data.createdAt.toDate === "function"
                ) {

                    reportDate =
                        data.createdAt
                            .toDate()
                            .toLocaleDateString("en-IN");

                }
                else {

                    reportDate =
                        new Date(data.createdAt)
                            .toLocaleDateString("en-IN");

                }

            }


            /* PLATFORM */

            const platform =
                data.platform || "Not specified";


            /* INCIDENT */

            const incident =
                data.description ||
                data.incident ||
                "No description";


            /* ADD ROW */

            tbody.innerHTML += `

                <tr>

                    <td>
                        <strong>
                            ${reportId}
                        </strong>
                    </td>


                    <td>
                        ${platform}
                    </td>


                    <td>
                        ${incident}
                    </td>


                    <td>
                        ${reportDate}
                    </td>


                    <td>

                        <span class="status ${statusClass}">
                            ${statusText}
                        </span>

                    </td>


                    <td>

                        <button
                            class="view-btn"
                            onclick="viewReport('${reportDoc.id}')"
                        >
                            View
                        </button>

                    </td>

                </tr>

            `;

        });


    }
    catch (error) {

        console.error(
            "Error loading reports:",
            error
        );


        /*
           If Firestore asks for an index,
           the console will show the required link.
        */

        tbody.innerHTML = `

            <tr>

                <td colspan="6" style="
                    text-align:center;
                    padding:30px;
                    color:#dc2626;
                ">

                    ❌ Unable to load your reports.

                    <br><br>

                    Please try again later.

                </td>

            </tr>

        `;

    }

});


/* ================================
   VIEW REPORT
================================ */

window.viewReport = async function(reportId) {

    try {

        const q = query(
            collection(db, "reports"),
            where("studentUID", "==", auth.currentUser.uid)
        );


        const snapshot =
            await getDocs(q);


        let report = null;


        snapshot.forEach((doc) => {

            if (doc.id === reportId) {

                report = doc.data();

            }

        });


        if (!report) {

            alert(
                "Report could not be found."
            );

            return;

        }


        alert(

            "📋 REPORT DETAILS\n\n" +

            "Report ID: " +
            (report.reportId || reportId) +

            "\n\nPlatform: " +
            (report.platform || "N/A") +

            "\n\nDate: " +
            (report.date || "N/A") +

            "\n\nStatus: " +
            (report.status || "Pending") +

            "\n\nDescription:\n" +
            (report.description ||
             report.incident ||
             "N/A")

        );

    }
    catch(error) {

        console.error(error);

        alert(
            "Unable to open this report."
        );

    }

};


/* ================================
   LOGOUT
================================ */

document
.getElementById("logoutBtn")
.onclick = async () => {

    try {

        await signOut(auth);

        window.location.href =
            "student-login.html";

    }
    catch(error) {

        console.error(
            "Logout error:",
            error
        );

        alert(
            "Unable to logout. Please try again."
        );

    }

};

</script>

</body>
</html>
