<section class="report-page">


<h1>🚨 Report Cyberbullying</h1>


<p>
Your report can be submitted anonymously. All reports are kept confidential.
</p>




<form id="reportForm">


<label>Student Name (Optional)</label>

<input 
type="text" 
id="name"
placeholder="Enter your name">





<label>Class</label>

<input 
type="text"
id="class"
placeholder="Example: 11">





<label>Section</label>

<input 
type="text"
id="section"
placeholder="Example: A">





<label>Platform</label>


<select id="platform">

<option>Instagram</option>

<option>WhatsApp</option>

<option>Facebook</option>

<option>Snapchat</option>

<option>Discord</option>

<option>Other</option>

</select>





<label>Date of Incident</label>

<input 
type="date"
id="date">





<label>Describe the Incident</label>


<textarea 
id="description"
rows="7"
placeholder="Describe what happened..."></textarea>





<label>Upload Screenshot</label>

<input type="file">





<button type="submit" class="btn">
Submit Report
</button>



</form>


</section>

<script type="module">

import { db, auth } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import {
collection,
addDoc,
doc,
getDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  let currentUser = null;
let currentStudent = null;

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        alert("Please login first.");

        window.location.href = "student-login.html";

        return;

    }

    currentUser = user;

    const studentRef = doc(db, "students", user.uid);
    const studentSnap = await getDoc(studentRef);

    if (!studentSnap.exists()) {

        alert("Student record not found.");

        return;

    }

    currentStudent = studentSnap.data();

    document.getElementById("name").value = currentStudent.name;
    document.getElementById("class").value = currentStudent.class;
    document.getElementById("section").value = currentStudent.section;

    document.getElementById("name").readOnly = true;
    document.getElementById("class").readOnly = true;
    document.getElementById("section").readOnly = true;

});
document
.getElementById("reportForm")
.addEventListener("submit", async function(e){


e.preventDefault();




try{


await addDoc(collection(db, "reports"), {

studentUID: currentUser.uid,

studentName: currentStudent.name,

admissionNo: currentStudent.admissionNo,

class: currentStudent.class,

section: currentStudent.section,

mobile: currentStudent.mobile,

}


});


</script>
