<style>

.report-page h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:10px;
}

.report-page > p{
    text-align:center;
    color:#64748b;
    margin-bottom:30px;
}

#reportForm label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:600;
    color:#334155;
}

#reportForm input,
#reportForm select,
#reportForm textarea{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    border:1px solid #cbd5e1;

}

#reportForm input:focus,
#reportForm select:focus,
#reportForm textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

#reportForm textarea{
    resize:vertical;
}

.student-info{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    padding:18px;
    border-radius:14px;
    margin-bottom:25px;
}

.student-info h3{
    margin:0 0 8px;
    color:#1e3a8a;
}

.student-info p{
    margin:5px 0;
    color:#475569;
}

.stream-box{
    display:none;
}

.btn{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
}

.btn:hover{
    background:#1d4ed8;
}

</style>

</head>


<body>


<header>

<nav>

<div class="logo">
🛡 CyberSafe

<section class="report-page">

<h1>🚨 Report Cyberbullying</h1>

<p>
Your report is confidential and will be shared only with authorized staff.
</p>


<div class="student-info">

<h3>🎓 Student Information</h3>

<p>
<strong>Name:</strong>
<span id="displayName">Loading...</span>
</p>

<p>
<strong>Class:</strong>
<span id="displayClass">Loading...</span>
</p>

<p id="streamDisplay" style="display:none;">
<strong>Stream:</strong>
<span id="displayStream"></span>
</p>

</div>


<form id="reportForm">


<label>Platform</label>

<select id="platform" required>

<option value="">Select Platform</option>

<option value="Instagram">Instagram</option>

<option value="WhatsApp">WhatsApp</option>

<option value="Facebook">Facebook</option>

<option value="Snapchat">Snapchat</option>

<option value="Discord">Discord</option>

<option value="YouTube">YouTube</option>

<option value="Other">Other</option>

</select>


<label>Date of Incident</label>

<input
type="date"
id="date"
required>


<label>Describe the Incident</label>

<textarea
id="description"
rows="7"
placeholder="Describe what happened..."
required></textarea>


<label>Upload Screenshot</label>

<input
type="file"
id="screenshot"
accept="image/*">


<button type="submit" class="btn">

🚨 Submit Report

</button>


</form>

</section>


<footer>

<p>
© 2026 CyberSafe Student Security Portal
</p>

</footer>


<script type="module">

import { db, auth } from "./js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    collection,
    addDoc,
    doc,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let currentUser = null;
let currentStudent = null;


// ==========================================
// LOAD STUDENT
// ==========================================

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        alert("Please login first.");

        window.location.href = "student-login.html";

        return;

    }


    try {

        currentUser = user;


        const studentRef =
            doc(db, "students", user.uid);


        const studentSnap =
            await getDoc(studentRef);


        if (!studentSnap.exists()) {

            alert("Student record not found.");

            return;

        }


        currentStudent =
            studentSnap.data();


        // ==============================
        // DISPLAY NAME
        // ==============================

        document.getElementById("displayName").textContent =
            currentStudent.name || "Student";


        // ==============================
        // DISPLAY CLASS
        // ==============================

        document.getElementById("displayClass").textContent =
            currentStudent.class || "-";


        // ==============================
        // DISPLAY STREAM
        // ==============================

        if (
            currentStudent.class === "11" ||
            currentStudent.class === "12"
        ) {

            document.getElementById("streamDisplay").style.display =
                "block";

            document.getElementById("displayStream").textContent =
                currentStudent.stream || "Not selected";

        }

    }

    catch(error) {

        console.error(
            "Student loading error:",
            error
        );

        alert(
            "Unable to load student information."
        );

    }

});


// ==========================================
// SUBMIT REPORT
// ==========================================

document
.getElementById("reportForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();


    if (!currentUser || !currentStudent) {

        alert(
            "Please wait while your account loads."
        );

        return;

    }


    try {

          // ==================================
    // GET SCREENSHOT
    // ==================================

    const screenshotFile =
        document.getElementById("screenshot").files[0];

    let screenshotData = "";

    if (screenshotFile) {

        screenshotData =
            await compressScreenshot(screenshotFile);

    }


        // ==================================
        // CREATE TEACHER ASSIGNMENT KEY
        // ==================================

        let classKey;


        // Classes 11 & 12
        // use stream

       if (
    currentStudent.class === "11" ||
    currentStudent.class === "12"
) {

    if (!currentStudent.stream) {

        alert(
            "Your stream is missing from your student profile.\n\n" +
            "Please contact your administrator."
        );

        return;
    }

    const stream =
        currentStudent.stream.trim().toLowerCase();

    if (stream === "science") {
        classKey = "Class" + currentStudent.class + "Science";
    }
    else if (stream === "commerce") {
        classKey = "Class" + currentStudent.class + "Commerce";
    }
    else if (
        stream === "humanities" ||
        stream === "humanity"
    ) {
        classKey = "Class" + currentStudent.class + "Humanities";
    }
    else {
        alert("Invalid stream in your student profile.");
        return;
    }

}

// Classes 1–10
else {

    classKey = "Class" + currentStudent.class;

}

console.log("Teacher assignment document:", classKey);
        console.log(
            "Teacher assignment key:",
            classKey
        );


  // ==================================
// FIND CLASS TEACHER
// ==================================

console.log("Student class:", currentStudent.class);
console.log("Student stream:", currentStudent.stream);
console.log("Teacher assignment key:", classKey);

const teacherRef = doc(
    db,
    "classTeachers",
    classKey
);

const teacherSnap = await getDoc(teacherRef);

if (!teacherSnap.exists()) {

    console.error(
        "❌ Teacher assignment not found:",
        "classTeachers/" + classKey
    );

    alert(
        "No teacher is assigned for " +
        currentStudent.class +
        " " +
        (currentStudent.stream || "") +
        ".\n\nPlease contact your administrator."
    );

    return;
}

const teacherData = teacherSnap.data();

console.log("✅ TEACHER FOUND:", teacherData);

console.log(
    "Teacher:",
    teacherData.TeacherName || "Not provided"
);

console.log(
    "Teacher Email:",
    teacherData.TeacherEmail || "Not provided"
);

console.log(
    "Teacher UID:",
    teacherData.TeacherUid || "Not provided"
);
        // ==========================================
// COMPRESS SCREENSHOT FOR FREE FIRESTORE STORAGE
// ==========================================

function compressScreenshot(file) {

    return new Promise((resolve, reject) => {

        if (!file) {
            resolve("");
            return;
        }

        const reader = new FileReader();

        reader.onload = function(event) {

            const img = new Image();

            img.onload = function() {

                const canvas = document.createElement("canvas");

                const maxWidth = 1000;
                const maxHeight = 1000;

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {

                    height =
                        height * (maxWidth / width);

                    width = maxWidth;

                }

                if (height > maxHeight) {

                    width =
                        width * (maxHeight / height);

                    height = maxHeight;

                }

                canvas.width = width;
                canvas.height = height;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );

                const compressedImage =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.6
                    );

                // Keep Firestore document safely below 1 MiB
                if (compressedImage.length > 500000) {

                    reject(
                        new Error(
                            "Screenshot is still too large. Please choose a smaller image."
                        )
                    );

                    return;
                }

                resolve(compressedImage);

            };

            img.onerror = function() {

                reject(
                    new Error("Unable to read screenshot.")
                );

            };

            img.src = event.target.result;

        };

        reader.onerror = function() {

            reject(
                new Error("Unable to load screenshot.")
            );

        };

        reader.readAsDataURL(file);

    });

}

        // ==================================
        // SUBMIT REPORT
        // ==================================

    await addDoc(
    collection(db, "reports"),
    {
        studentUID: currentUser.uid,

        studentName:
            currentStudent.name || "",

        admissionNo:
            currentStudent.admissionNo || "",

        class:
            currentStudent.class || "",

        stream:
            currentStudent.stream || "",

        mobile:
            currentStudent.mobile || "",

        email:
            currentStudent.email || "",

        platform:
            document.getElementById("platform").value,

        date:
            document.getElementById("date").value,

        description:
            document
                .getElementById("description")
                .value
                .trim(),

        screenshotData:
            screenshotData,

        status:
            "Pending",

        // =====================================
        // TEACHER ASSIGNMENT
        // =====================================

        assignedTeacherName:
            teacherData.TeacherName || "",

        assignedTeacherEmail:
            teacherData.TeacherEmail || "",

        assignedTeacherUid:
            teacherData.TeacherUid || "",

        assignedClass:
            classKey,

        // =====================================
        // IMPORTANT:
        // THIS IS THE FIELD TEACHER DASHBOARD USES
        // =====================================

    assignedTeacherName:
    teacherData.TeacherName || "",

assignedTeacherEmail:
    teacherData.TeacherEmail || "",

assignedTeacherUid:
    teacherData.TeacherUid || "",

assignedClass:
    classKey,

teacherEmail:
    teacherData.TeacherEmail || "",

teacherUID:
    teacherData.TeacherUid || "",

classTeacherKey:
    classKey,
        // ==================================
        // TIMESTAMP
        // ==================================

        createdAt:
            serverTimestamp()
    }
);

alert(
    "✅ Report submitted successfully!"
);

document
    .getElementById("reportForm")
    .reset();

    }

    catch(error) {

        console.error(
            "Report submission error:",
            error
        );


        alert(
            "❌ Error submitting report:\n\n" +
            error.message
        );

    }

});

</script>


</body>

</html>
