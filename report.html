<section class="report-page">

<h1>Report Cyberbullying</h1>

<p>Your report can be submitted anonymously. All reports are kept confidential.</p>

<form>

<label>Student Name (Optional)</label>
<input type="text" placeholder="Enter your name">

<label>Class</label>
<input type="text" placeholder="Example: 11">

<label>Section</label>
<input type="text" placeholder="Example: A">

<label>Platform</label>

<select>
<option>Instagram</option>
<option>WhatsApp</option>
<option>Facebook</option>
<option>Snapchat</option>
<option>Discord</option>
<option>Other</option>
</select>

<label>Date of Incident</label>
<input type="date">

<label>Describe the Incident</label>

<textarea rows="7" placeholder="Describe what happened..."></textarea>

<label>Upload Screenshot</label>

<input type="file">

<button type="submit">Submit Report</button>

</form>

</section>
