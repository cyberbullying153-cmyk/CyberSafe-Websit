<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Management | CyberSafe</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

.modal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    background:#fff;
    padding:30px;
    border-radius:15px;
    width:450px;
}

.modal-content h2{
    margin-bottom:20px;
}

.modal-content input,
.modal-content select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.modal-buttons button{
    flex:1;
}

</style>

</head>

<body>

<header>

<nav>

<div class="logo">
<img src="images/logo.png">
<span>CYBERSAFE</span>
</div>

<ul class="nav-links">

<li><a href="admin.html">Dashboard</a></li>

<li><a href="students.html">Students</a></li>

<li><a href="teacher.html">Teachers</a></li>

<li><a href="analytics.html">Analytics</a></li>

<li>
<button onclick="logout()" class="login-btn">
Logout
</button>
</li>

</ul>

</nav>

</header>

<section class="report-page">

<h1>👨‍🎓 Student Management</h1>

<p class="subtitle">

Register and manage students.

</p>

<div style="display:flex;justify-content:space-between;margin-bottom:25px;">

<input
type="text"
id="searchStudent"
placeholder="🔍 Search Student..."
style="width:300px;padding:12px;border-radius:8px;border:1px solid #ccc;">

<button
id="addStudentBtn"
class="login-btn">

➕ Add Student

</button>

</div>

<table class="report-table">

<thead>

<tr>

<th>Admission No</th>

<th>Name</th>

<th>Class</th>

<th>Section</th>

<th>Student Mobile</th>

<th>Parent Mobile</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="studentBody">

</tbody>

</table>

</section>

<!-- Add Student Modal -->

<div id="studentModal" class="modal">

<div class="modal-content">

<h2>Add Student</h2>

<input id="admissionNo" placeholder="Admission Number">

<input id="studentName" placeholder="Student Name">

<select id="studentClass">

<option value="">Select Class</option>

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>

</select>

<input id="section" placeholder="Section">

<input id="studentMobile" placeholder="Student Mobile">

<input id="parentMobile" placeholder="Parent Mobile">

<input id="studentEmail" placeholder="Email (Optional)">

<div class="modal-buttons">

<button id="saveStudent" class="login-btn">

Save Student

</button>

<button id="closeModal">

Cancel

</button>

</div>

</div>

</div>

<footer>

<p>

© 2026 CyberSafe

</p>

</footer>

<script type="module">

import { db, auth } from "./js/firebase.js";

import {
    collection,
    addDoc,
    onSnapshot,
    doc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const studentBody = document.getElementById("studentBody");
const searchStudent = document.getElementById("searchStudent");

let allStudents = [];


// =========================================
// LOAD ALL STUDENTS
// =========================================

onSnapshot(
    collection(db, "students"),
    (snapshot) => {

        allStudents = [];

        snapshot.forEach((studentDoc) => {

            allStudents.push({
                id: studentDoc.id,
                ...studentDoc.data()
            });

        });

        displayStudents(allStudents);
    },

    (error) => {

        console.error("Students loading error:", error);

        studentBody.innerHTML = `
            <tr>
                <td colspan="8">
                    ❌ Unable to load students
                </td>
            </tr>
        `;
    }
);


// =========================================
// DISPLAY STUDENTS
// =========================================

function displayStudents(students) {

    studentBody.innerHTML = "";

    if (students.length === 0) {

        studentBody.innerHTML = `
            <tr>
                <td colspan="8">
                    No students found.
                </td>
            </tr>
        `;

        return;
    }


    students.forEach((student) => {

        studentBody.innerHTML += `

            <tr>

                <td>
                    ${student.admissionNo || "Not provided"}
                </td>

                <td>
                    ${student.name || "Not provided"}
                </td>

                <td>
                    ${student.class || "Not provided"}
                </td>

                <td>
                    ${student.section || "Not provided"}
                </td>

                <td>
                    ${student.studentMobile || "Not provided"}
                </td>

                <td>
                    ${student.parentMobile || "Not provided"}
                </td>

                <td>
                    <span class="status active">
                        ${student.status || "Active"}
                    </span>
                </td>

                <td>

                    <button
                        onclick="deleteStudent('${student.id}')"
                        style="
                            background:#ef4444;
                            color:white;
                            border:none;
                            padding:8px 12px;
                            border-radius:6px;
                            cursor:pointer;
                        "
                    >
                        🗑 Delete
                    </button>

                </td>

            </tr>

        `;

    });

}
const modal = document.getElementById("studentModal");
// =========================================
// SEARCH STUDENTS
// =========================================

searchStudent.addEventListener("input", () => {

    const search = searchStudent.value
        .toLowerCase()
        .trim();

    const filtered = allStudents.filter((student) => {

        return (
            String(student.admissionNo || "")
                .toLowerCase()
                .includes(search)

            ||

            String(student.name || "")
                .toLowerCase()
                .includes(search)

            ||

            String(student.class || "")
                .toLowerCase()
                .includes(search)

            ||

            String(student.section || "")
                .toLowerCase()
                .includes(search)

            ||

            String(student.studentMobile || "")
                .toLowerCase()
                .includes(search)

        );

    });

    displayStudents(filtered);

});
document.getElementById("addStudentBtn").onclick = () => {
    modal.style.display = "flex";
};

document.getElementById("closeModal").onclick = () => {
    modal.style.display = "none";
};

window.onclick = (e) => {
    if (e.target == modal) {
        modal.style.display = "none";
    }
};

document.getElementById("saveStudent").addEventListener("click", async () => {

    console.log("Save button clicked");

    const student = {
        admissionNo: document.getElementById("admissionNo").value,
        name: document.getElementById("studentName").value,
        class: document.getElementById("studentClass").value,
        section: document.getElementById("section").value,
        studentMobile: document.getElementById("studentMobile").value,
        parentMobile: document.getElementById("parentMobile").value,
        email: document.getElementById("studentEmail").value,
        status: "Active",
        createdAt: new Date()
    };

    try {

        const docRef = await addDoc(collection(db, "students"), student);

        console.log("Document ID:", docRef.id);

        alert("Student Added Successfully!");

        location.reload();

    } catch (error) {

        console.error(error);

        alert(error.code + " : " + error.message);

    }

});

window.logout = async function () {
    await signOut(auth);
    window.location.href = "admin-login.html";
};
</body>

</html>
