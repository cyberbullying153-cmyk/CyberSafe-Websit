<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | CyberSafe</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<header>

<nav>

<div class="logo">
🛡 CyberSafe
</div>


<ul class="nav-links">

<li><a href="admin.html">Dashboard</a></li>

<li><a href="teacher.html">Teachers</a></li>

<li><a href="#" onclick="logout()" class="login-btn">Logout</a></li>

</ul>

</nav>

</header>



<section class="report-page">


<h1>👨‍💼 Admin Dashboard</h1>

<p class="subtitle">
Real-time CyberSafe Report Management
</p>



<div class="stats">


<div class="stat">

<h2 id="totalReports">0</h2>

<p>Total Reports</p>

</div>



<div class="stat">

<h2 id="pendingReports">0</h2>

<p>Pending Reports</p>

</div>



<div class="stat">

<h2 id="resolvedReports">0</h2>

<p>Resolved Reports</p>

</div>


</div>




<h2 style="margin-top:50px;">
📋 Student Reports
</h2>



<div id="reportsContainer" class="emergency-grid">

</div>



</section>




<footer>

<p>
© 2026 CyberSafe | Student Security Portal
</p>

</footer>





<script type="module">


import { db, auth } from "./js/firebase.js";


import {

collection,

onSnapshot,

doc,

updateDoc

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {

onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



// Protect Admin Dashboard

onAuthStateChanged(auth, (user)=>{


if(!user){

window.location.href = "admin-login.html";

}


});





const reportsContainer =
document.getElementById("reportsContainer");



const totalReports =
document.getElementById("totalReports");


const pendingReports =
document.getElementById("pendingReports");


const resolvedReports =
document.getElementById("resolvedReports");






onSnapshot(collection(db,"reports"),(snapshot)=>{


reportsContainer.innerHTML="";


let total=0;

let pending=0;

let resolved=0;




snapshot.forEach((report)=>{


total++;


let data = report.data();




if(data.status==="Pending")
{
pending++;
}


if(data.status==="Resolved")
{
resolved++;
}





reportsContainer.innerHTML += `



<div class="emergency-card">


<h2>🚨 ${data.type || data.platform}</h2>


<p>
<b>Name:</b> ${data.name || "Anonymous"}
</p>


<p>
<b>Class:</b> ${data.class || ""}
</p>


<p>
<b>Section:</b> ${data.section || ""}
</p>


<p>
<b>Description:</b><br>
${data.description}
</p>



<p>
<b>Status:</b>
${data.status}
</p>



<button 
class="btn"
onclick="resolveReport('${report.id}')">

Mark Resolved

</button>


</div>



`;



});



totalReports.innerHTML=total;

pendingReports.innerHTML=pending;

resolvedReports.innerHTML=resolved;



});






window.resolveReport = async function(id){


await updateDoc(doc(db,"reports",id),{

status:"Resolved"

});


alert("Report updated");


}




window.logout = async function(){

await signOut(auth);

alert("✅ Logged out successfully");

window.location.href="admin-login.html";

}

</script>



</body>

</html>
