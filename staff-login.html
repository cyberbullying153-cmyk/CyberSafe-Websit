<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Login | CyberSafe</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<nav>

<div class="logo">
🛡 CyberSafe
</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="report.html">Report</a></li>

<li><a href="learn.html">Learn</a></li>

<li><a href="resources.html">Resources</a></li>

</ul>

</nav>

</header>

<section class="login-container">

<h1>👨‍🏫 Staff Login</h1>

<p>
Only registered teachers and administrators can log in.
</p>

<form id="loginForm" class="login-form">

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit" class="btn report-btn">
Login
</button>

</form>

</section>

<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


document.getElementById("loginForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {

        // =====================================
        // 1. FIREBASE AUTHENTICATION
        // =====================================

        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const user = userCredential.user;

        console.log("Authenticated UID:", user.uid);
        console.log("Authenticated Email:", user.email);


        // =====================================
        // 2. CHECK TEACHERS COLLECTION
        // Document ID MUST BE Firebase UID
        // =====================================

        const teacherRef =
            doc(db, "teachers", user.uid);

        const teacherSnap =
            await getDoc(teacherRef);


        if (!teacherSnap.exists()) {

            await signOut(auth);

            alert(
                "❌ Access Denied.\n\n" +
                "This account is not registered as a teacher or administrator."
            );

            return;
        }


        // =====================================
        // 3. GET TEACHER DATA
        // =====================================

        const teacherData =
            teacherSnap.data();

        console.log("Teacher Data:", teacherData);


        // =====================================
        // 4. CHECK EMAIL
        // =====================================

        if (
            teacherData.email.toLowerCase() !==
            user.email.toLowerCase()
        ) {

            await signOut(auth);

            alert(
                "❌ Access Denied.\n\n" +
                "The teacher email does not match the Firebase account."
            );

            return;
        }


        // =====================================
        // 5. CHECK ROLE
        // =====================================

        const role =
            (teacherData.role || "teacher")
            .toLowerCase();


        if (
            role !== "teacher" &&
            role !== "admin" &&
            role !== "administrator"
        ) {

            await signOut(auth);

            alert(
                "❌ Access Denied.\n\n" +
                "Your account does not have staff permission."
            );

            return;
        }


        // =====================================
        // 6. LOGIN SUCCESS
        // =====================================

        alert(
            "✅ Staff Login Successful!\n\n" +
            "Welcome " +
            (teacherData.name || "Teacher")
        );


        // Admin → Admin Dashboard
        if (
            role === "admin" ||
            role === "administrator"
        ) {

            window.location.href =
                "admin.html";

            return;
        }


        // Teacher → Teacher Dashboard
        window.location.href =
            "teacher.html";


    }

    catch (error) {

        console.error(
            "Staff Login Error:",
            error
        );


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            alert(
                "❌ Invalid email or password."
            );

        }

        else if (
            error.code ===
            "auth/user-not-found"
        ) {

            alert(
                "❌ No Firebase account exists with this email."
            );

        }

        else if (
            error.code ===
            "auth/wrong-password"
        ) {

            alert(
                "❌ Incorrect password."
            );

        }

        else if (
            error.code ===
            "permission-denied"
        ) {

            alert(
                "❌ Firestore permission denied.\n\n" +
                "Please check the Firestore rules."
            );

        }

        else {

            alert(
                "❌ " + error.message
            );

        }

    }

});

</script>

</body>

</html>
