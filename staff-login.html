<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Login | CyberSafe</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<nav>

<div class="logo">
🛡 CyberSafe
</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="report.html">Report</a></li>

<li><a href="learn.html">Learn</a></li>

<li><a href="resources.html">Resources</a></li>

</ul>

</nav>

</header>

<section class="login-container">

<h1>👨‍🏫 Staff Login</h1>

<p>
Only registered teachers and administrators can log in.
</p>

<form id="loginForm" class="login-form">

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit" class="btn report-btn">
Login
</button>

</form>

</section>

<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const loginForm = document.getElementById("loginForm");


loginForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;


    if (!email || !password) {

        alert("Please enter your email and password.");

        return;
    }


    try {

        // ==============================
        // FIREBASE LOGIN
        // ==============================

        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user = userCredential.user;


        // ==============================
        // CHECK TEACHER RECORD
        // ==============================

        const teacherQuery = query(
            collection(db, "teachers"),
            where("email", "==", user.email)
        );


        const teacherSnapshot =
            await getDocs(teacherQuery);


        // ==============================
        // NO TEACHER FOUND
        // ==============================

        if (teacherSnapshot.empty) {

            await signOut(auth);

            alert(
                "❌ Access Denied.\n\n" +
                "This account is not registered as a teacher or administrator."
            );

            return;
        }


        // ==============================
        // TEACHER FOUND
        // ==============================

        const teacherDoc =
            teacherSnapshot.docs[0];

        const teacherData =
            teacherDoc.data();


        // ==============================
        // CHECK ROLE
        // ==============================

        const role =
            String(teacherData.role || "teacher")
            .toLowerCase();


        if (role === "admin") {

            alert("✅ Admin Login Successful!");

            window.location.href = "admin.html";

            return;
        }


        if (role === "teacher") {

            alert("✅ Teacher Login Successful!");

            window.location.href = "teacher.html";

            return;
        }


        // ==============================
        // UNKNOWN ROLE
        // ==============================

        await signOut(auth);

        alert(
            "❌ Access Denied.\n\n" +
            "Your staff account does not have a valid role."
        );

    }


    catch (error) {

        console.error("Staff Login Error:", error);


        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/user-not-found" ||
            error.code === "auth/wrong-password"
        ) {

            alert("❌ Invalid email or password.");

        }

        else if (
            error.code === "permission-denied"
        ) {

            alert(
                "❌ Firestore permission denied.\n\n" +
                "Please check your Firestore Rules."
            );

        }

        else {

            alert(
                "❌ Login failed.\n\n" +
                error.message
            );

        }

    }

});

</script>

</body>

</html>
