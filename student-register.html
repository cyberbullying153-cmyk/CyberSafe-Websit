```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration | CyberSafe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0b1120,#1e3a8a,#111827);
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.container{
width:100%;
max-width:720px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.12);
border-radius:28px;
padding:40px;
color:white;
box-shadow:0 25px 50px rgba(0,0,0,.35);
}

.logo{
display:flex;
justify-content:center;
margin-bottom:20px;
}

.logo img{
width:80px;
height:80px;
border-radius:18px;
box-shadow:0 0 25px rgba(37,99,235,.5);
}

h1{
text-align:center;
font-size:34px;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.input-group{
display:flex;
flex-direction:column;
gap:8px;
}

.input-group.full{
grid-column:1/-1;
}

label{
font-weight:600;
font-size:14px;
}

input,
select{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1f2937;
color:white;
font-size:15px;
outline:none;
}

input::placeholder{
color:#94a3b8;
}

button{
width:100%;
padding:15px;
margin-top:25px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:white;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 12px 30px rgba(37,99,235,.35);
}

.login-link{
text-align:center;
margin-top:20px;
color:#cbd5e1;
}

.login-link a{
color:#60a5fa;
font-weight:600;
text-decoration:none;
}

#message{
margin-top:15px;
text-align:center;
font-weight:600;
}

@media(max-width:700px){
.grid{
grid-template-columns:1fr;
}
}
</style>

</head>
<body>

<div class="container">

<div class="logo">
<img src="images/logo.png" alt="CyberSafe">
</div>

<h1>🎓 Student Registration</h1>
<p class="subtitle">Create your CyberSafe Student Account</p>

<form id="registerForm">

<div class="grid">

<div class="input-group full">
<label>Full Name</label>
<input type="text" id="name" placeholder="Enter full name" required>
</div>

<div class="input-group">
<label>Admission Number</label>
<input type="text" id="admission" placeholder="Admission No." required>
</div>

<div class="input-group">
<label>Class</label>
<select id="studentClass" required>
<option value="">Select Class</option>
<option value="1">Class 1</option>
<option value="2">Class 2</option>
<option value="3">Class 3</option>
<option value="4">Class 4</option>
<option value="5">Class 5</option>
<option value="6">Class 6</option>
<option value="7">Class 7</option>
<option value="8">Class 8</option>
<option value="9">Class 9</option>
<option value="10">Class 10</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>
</div>

<div class="input-group">
<label>Section</label>
<select id="section" required>
<option value="">Select Section</option>
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>
</div>

<div class="input-group" id="streamGroup" style="display:none;">
<label>Stream</label>
<select id="stream">
<option value="">Select Stream</option>
<option>Science</option>
<option>Commerce</option>
<option>Humanities</option>
</select>
</div>

<div class="input-group">
<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="9876543210" required>
</div>

<div class="input-group full">
<label>Email Address</label>
<input type="email" id="email" placeholder="student@gmail.com" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Minimum 6 characters" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm password" required>
</div>

</div>

<button type="submit">🚀 Register Student</button>

<p id="message"></p>

</form>

<div class="login-link">
Already registered?
<a href="student-login.html">Login Here</a>
</div>

</div>

<script type="module">

import { auth, db } from "./js/firebase.js";

import {
createUserWithEmailAndPassword,
sendEmailVerification,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form=document.getElementById("registerForm");
const msg=document.getElementById("message");

const studentClass=document.getElementById("studentClass");
const streamGroup=document.getElementById("streamGroup");
const stream=document.getElementById("stream");

studentClass.addEventListener("change",()=>{

if(studentClass.value==="11"||studentClass.value==="12"){

streamGroup.style.display="block";
stream.required=true;

}else{

streamGroup.style.display="none";
stream.required=false;
stream.value="";

}

});

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const name=document.getElementById("name").value.trim();
const admission=document.getElementById("admission").value.trim();
const classValue=document.getElementById("studentClass").value;
const section=document.getElementById("section").value;
const streamValue=document.getElementById("stream").value;
const mobile=document.getElementById("mobile").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const confirm=document.getElementById("confirmPassword").value;

if(password!==confirm){
alert("❌ Passwords do not match.");
return;
}

if(password.length<6){
alert("❌ Password must be at least 6 characters.");
return;
}

if(!/^[6-9]\d{9}$/.test(mobile)){
alert("❌ Enter a valid 10-digit Indian mobile number.");
return;
}

msg.textContent="Creating account...";

try{

const userCredential=await createUserWithEmailAndPassword(auth,email,password);
const user=userCredential.user;

await sendEmailVerification(user);

await setDoc(doc(db,"students",user.uid),{

uid:user.uid,
name:name,
admissionNo:admission,
class:classValue,
section:section,
stream:streamValue,
mobile:mobile,
email:email,
role:"student",
status:"Active",
createdAt:Date.now()

});

await signOut(auth);

alert(
"🎉 Registration Successful!\n\n"+
"Verification email sent to:\n"+email+
"\n\nVerify your email before login."
);

window.location.href="student-login.html";

}catch(error){

console.error(error);

if(error.code==="auth/email-already-in-use"){
alert("❌ Email already registered.");
}
else if(error.code==="auth/invalid-email"){
alert("❌ Invalid email address.");
}
else if(error.code==="auth/weak-password"){
alert("❌ Password is too weak.");
}
else{
alert("❌ "+error.message);
}

msg.textContent="";

}

});

</script>

</body>
</html>
