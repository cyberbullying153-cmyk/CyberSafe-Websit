<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration | CyberSafe</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:#eef4ff;
}

.container{
max-width:700px;
margin:50px auto;
background:#fff;
padding:40px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#1e3a8a;
margin-bottom:30px;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:600;
margin-bottom:8px;
}

input,
select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#22c55e;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#16a34a;
}

.login-link{
text-align:center;
margin-top:20px;
}

.login-link a{
text-decoration:none;
color:#2563eb;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>🎓 Student Registration</h1>

<form id="registerForm">

<div class="input-group">
<label>Full Name</label>
<input type="text" id="name" required>
</div>

<div class="input-group">
<label>Admission Number</label>
<input type="text" id="admission" required>
</div>

<div class="input-group">
<label>Class</label>

<select id="studentClass">

<option value="">Select Class</option>

<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>

</select>

</div>

<div class="input-group">
<label>Section</label>

<select id="section">

<option>A</option>
<option>B</option>
<option>C</option>

</select>

</div>

<div class="input-group">
<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="10-digit mobile number" required>
</div>


<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" required>
</div>

<button type="submit">

Register

</button>

</form>
<div class="login-link">

Already registered?

<a href="student-login.html">

Login Here

</a>

</div>

</div>

<script type="module">
import { auth, db } from "./js/firebase.js";

import {
    createUserWithEmailAndPassword,
    sendEmailVerification,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const form = document.getElementById("registerForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const admission = document.getElementById("admission").value.trim();
    const studentClass = document.getElementById("studentClass").value;
    const section = document.getElementById("section").value;
    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (password !== confirm) {
        alert("Passwords do not match.");
        return;
    }

    try {

        const userCredential = await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        const user = userCredential.user;

        await sendEmailVerification(user);

        await setDoc(doc(db, "students", user.uid), {
            uid: user.uid,
            name,
            admissionNo: admission,
            class: studentClass,
            section,
            mobile,
            email,
            role: "student",
            status: "Active",
            createdAt: new Date()
        });

        alert(
            "Registration Successful!\n\nA verification email has been sent.\nPlease verify your email before logging in."
        );

        await signOut(auth);

        window.location.href = "student-login.html";

    catch (error) {

    console.error("Registration Error:", error);

    alert(
        "Code: " + error.code +
        "\n\nMessage: " + error.message
    );

}
</script>

</body>

</html>
