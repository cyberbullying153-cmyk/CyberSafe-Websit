<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration | CyberSafe</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:#eef4ff;
}

.container{
max-width:700px;
margin:50px auto;
background:#fff;
padding:40px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#1e3a8a;
margin-bottom:30px;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:600;
margin-bottom:8px;
}

input,
select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#22c55e;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#16a34a;
}

.login-link{
text-align:center;
margin-top:20px;
}

.login-link a{
text-decoration:none;
color:#2563eb;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<h1>🎓 Student Registration</h1>

<form id="registerForm">

<div class="input-group">
<label>Full Name</label>
<input type="text" id="name" required>
</div>

<div class="input-group">
<label>Admission Number</label>
<input type="text" id="admission" required>
</div>

<div class="input-group">
<label>Class</label>

<select id="studentClass" required>

    <option value="">Select Class</option>

    <option value="1">Class 1</option>
    <option value="2">Class 2</option>
    <option value="3">Class 3</option>
    <option value="4">Class 4</option>
    <option value="5">Class 5</option>
    <option value="6">Class 6</option>
    <option value="7">Class 7</option>
    <option value="8">Class 8</option>
    <option value="9">Class 9</option>
    <option value="10">Class 10</option>
    <option value="11">Class 11</option>
    <option value="12">Class 12</option>

</select>

</div>
<div class="input-group" id="streamGroup" style="display:none;">

    <label>Stream</label>

    <select id="stream">

        <option value="">Select Stream</option>

        <option value="Science">Science</option>

        <option value="Commerce">Commerce</option>

        <option value="Humanities">Humanities</option>

    </select>

</div>
<div class="input-group">
<label>Section</label>

<select id="section">

<option>A</option>
<option>B</option>
<option>C</option>

</select>

</div>

<div class="input-group">
<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="10-digit mobile number" required>
</div>


<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" required>
</div>

<button type="submit">

Register

</button>

</form>
<div class="login-link">

Already registered?

<a href="student-login.html">

Login Here

</a>

</div>

</div>

<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    createUserWithEmailAndPassword,
    sendEmailVerification,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const form = document.getElementById("registerForm");
const studentClass = document.getElementById("studentClass");
const streamGroup = document.getElementById("streamGroup");
const stream = document.getElementById("stream");

studentClass.addEventListener("change", () => {

    if (
        studentClass.value === "11" ||
        studentClass.value === "12"
    ) {

        streamGroup.style.display = "block";
        stream.required = true;

    } else {

        streamGroup.style.display = "none";
        stream.required = false;
        stream.value = "";

    }

});

form.addEventListener("submit", async (e) => {

    e.preventDefault();


    const name =
        document.getElementById("name").value.trim();

    const admission =
        document.getElementById("admission").value.trim();

    const studentClass =
        document.getElementById("studentClass").value;
    
    const studentStream =
    document.getElementById("stream").value;
    
    const section =
        document.getElementById("section").value;

    const mobile =
        document.getElementById("mobile").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirm =
        document.getElementById("confirmPassword").value;


    // Check password
    if (password !== confirm) {

        alert("❌ Passwords do not match.");

        return;
    }


    // Check password length
    if (password.length < 6) {

        alert("❌ Password must contain at least 6 characters.");

        return;
    }


    try {

        // Create Firebase Authentication account
        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user = userCredential.user;


        // Send email verification
        await sendEmailVerification(user);


        // Save student information in Firestore
        await setDoc(
            doc(db, "students", user.uid),
            {

                uid: user.uid,

                name: name,

                admissionNo: admission,

                class: studentClass,

                section: section,

                stream: studentStream,
                
                mobile: mobile,

                email: email,

                role: "student",

                status: "Active",

                createdAt: new Date()

            }
        );


        // Registration successful
        alert(
            "🎉 Registration Successful!\n\n" +
            "A verification email has been sent to:\n" +
            email +
            "\n\n" +
            "Please check your Inbox or Spam folder, " +
            "verify your email, and then login."
        );


        // Sign out until email is verified
        await signOut(auth);


        // Go to student login
        window.location.href =
            "student-login.html";


    } catch (error) {

        console.error(
            "Registration Error:",
            error
        );


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            alert(
                "❌ This email is already registered.\n\n" +
                "Please use another email or use Forgot Password."
            );

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            alert(
                "❌ Please enter a valid email address."
            );

        }

        else if (
            error.code ===
            "auth/weak-password"
        ) {

            alert(
                "❌ Password is too weak.\n\n" +
                "Use at least 6 characters."
            );

        }

        else {

            alert(
                "❌ Registration failed.\n\n" +
                error.code +
                "\n\n" +
                error.message
            );

        }

    }

});

</script>

</body>

</html>
